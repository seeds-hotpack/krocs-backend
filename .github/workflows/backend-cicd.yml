name: 🚀 Backend CI/CD with Docker Compose + ECR + RDS + Submodules

on:
  push:
    branches: [ develop ]
    paths:
      - 'backend/**'
      - '.gitmodules'

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'

    steps:
      # 1. 코드 체크아웃 (서브모듈 포함)
      - name: 📥 Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          token: ${{ secrets.SUBMODULE_TOKEN }}

      # 2. 서브모듈 상태 확인
      - name: 🔍 Verify submodule status
        run: |
          echo "📊 Submodule status:"
          git submodule status
          echo ""
          echo "📁 Checking krocs-config directory:"
          ls -la backend/src/main/resources/
          if [ -d "backend/src/main/resources/krocs-config" ]; then
            echo "✅ krocs-config submodule found"
            ls -la backend/src/main/resources/krocs-config/
          else
            echo "❌ krocs-config submodule not found!"
            exit 1
          fi

      # 3. Java 환경 설정
      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # 4. Gradle 설정
      - name: 🔧 Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: wrapper

      - name: 🔑 Grant execute permission for gradlew
        run: chmod +x backend/gradlew

      # 5. 테스트 실행 (일부 실패 허용)
      - name: 🧪 Run tests with failure tolerance
        working-directory: ./backend
        run: |
          echo "🧪 Running tests (allowing some failures for deployment)..."
          ./gradlew test --continue || echo "⚠️ Some tests failed, but continuing with deployment"
          echo "📋 Test results will be uploaded for review"
        continue-on-error: true

      # 5-1. 테스트 결과 업로드 (실패해도 결과 확인 가능)
      - name: 📊 Upload test results
        uses: actions/upload-artifact@v4
        if: always()  # 성공/실패 관계없이 업로드
        with:
          name: test-results
          path: backend/build/reports/tests/
          retention-days: 7

      # 6. AWS 자격증명 설정
      - name: 🔐 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 7. ECR 로그인
      - name: 🐳 Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 8. Docker 이미지 빌드 및 ECR 푸시
      - name: 🏗️ Build and push Docker image to ECR
        working-directory: ./backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "🔨 Building Docker image..."
          echo "📋 Build context contents:"
          ls -la
          echo "📋 Config directory contents:"
          ls -la src/main/resources/krocs-config/ || echo "Config directory not found"
          
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          
          echo "📤 Pushing Docker image to ECR..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          
          echo "✅ Image pushed to ECR successfully!"
          echo "📍 Image URI: $ECR_REGISTRY/$ECR_REPOSITORY:latest"

      # 9. EC2 배포 (Docker Compose 사용)
      - name: 🚀 Deploy to EC2 with Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            echo "🚀 Starting deployment to EC2..."
            
            # AWS CLI 환경변수 설정
            export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
            export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
            export AWS_DEFAULT_REGION="${{ env.AWS_REGION }}"
            
            # ECR 로그인
            echo "🔐 Logging into ECR..."
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}
            
            # 배포 디렉토리 생성
            mkdir -p /home/ubuntu/krocs-deploy
            cd /home/ubuntu/krocs-deploy
            
            # Docker Compose 설정 파일 생성
            echo "📝 Creating production docker-compose.yml..."
            cat > docker-compose.prod.yml << 'EOF'
            version: "3.8"
            
            services:
              krocs-backend:
                image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
                container_name: krocs-backend
                ports:
                  - "8080:8080"
                  - "80:8080"
                environment:
                  - SPRING_PROFILES_ACTIVE=prod
                  - REDIS_HOST=redis
                  - REDIS_PORT=6379
                  - DB_URL=${{ secrets.DB_URL }}
                  - DB_USER=${{ secrets.DB_USER }}
                  - DB_PASSWORD=${{ secrets.DB_PASSWORD }}
                depends_on:
                  redis:
                    condition: service_healthy
                restart: unless-stopped
                networks:
                  - krocs-network
                healthcheck:
                  test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
                  interval: 30s
                  timeout: 10s
                  retries: 3
                  start_period: 60s
            
              redis:
                image: redis:7-alpine
                container_name: krocs-redis
                ports:
                  - "6379:6379"
                volumes:
                  - krocs-redis-data:/data
                command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
                healthcheck:
                  test: ["CMD", "redis-cli", "ping"]
                  interval: 5s
                  timeout: 3s
                  retries: 30
                restart: unless-stopped
                networks:
                  - krocs-network
            
            volumes:
              krocs-redis-data:
            
            networks:
              krocs-network:
                driver: bridge
            EOF
            
            # 기존 서비스 중지
            echo "🔴 Stopping existing services..."
            docker-compose -f docker-compose.prod.yml down || true
            
            # 오래된 이미지 정리
            echo "🧹 Cleaning up old images..."
            docker image prune -f || true
            
            # 최신 이미지 풀
            echo "📥 Pulling latest image from ECR..."
            docker pull ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            
            # 서비스 시작
            echo "🚀 Starting services with Docker Compose..."
            docker-compose -f docker-compose.prod.yml up -d
            
            # 배포 상태 확인
            echo "📊 Checking deployment status..."
            sleep 10
            docker-compose -f docker-compose.prod.yml ps
            
            # 헬스체크 수행
            echo "🏥 Performing health checks..."
            max_attempts=20
            attempt=1
            
            while [ $attempt -le $max_attempts ]; do
              echo "🔍 Health check attempt $attempt/$max_attempts..."
            
              if curl -f -s http://localhost:8080/actuator/health > /dev/null 2>&1; then
                echo "✅ Application health check passed!"
                break
              else
                echo "⏳ Application not ready yet, waiting 15 seconds..."
                sleep 15
                attempt=$((attempt + 1))
              fi
            done
            
            if [ $attempt -gt $max_attempts ]; then
              echo "❌ Health check failed after $max_attempts attempts"
              echo "📋 Application logs:"
              docker-compose -f docker-compose.prod.yml logs --tail=50 krocs-backend
              echo "📋 Redis logs:"
              docker-compose -f docker-compose.prod.yml logs --tail=20 redis
              exit 1
            fi
            
            # 최종 상태 확인
            echo "📊 Final deployment status:"
            docker-compose -f docker-compose.prod.yml ps
            echo ""
            echo "🎉 Deployment completed successfully!"
            echo "🌐 Application URL: http://${{ secrets.EC2_HOST }}:8080"
            echo "🏥 Health check: http://${{ secrets.EC2_HOST }}:8080/actuator/health"
            echo "📊 Submodule info: krocs-config submodule automatically loaded"