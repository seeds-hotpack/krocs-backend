name: 🚀 Backend CI/CD with Docker Compose + Docker Hub + GCP + Submodules

on:
  push:
    branches: [ develop ]

env:
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
  DOCKER_HUB_REPOSITORY: ${{ secrets.DOCKER_HUB_REPOSITORY }}

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'

    steps:
      # 1. 코드 체크아웃 (서브모듈 포함)
      - name: 📥 Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          token: ${{ secrets.SUBMODULE_TOKEN }}

      # 2. 서브모듈 상태 확인
      - name: 🔍 Verify submodule status
        run: |
          echo "📊 Submodule status:"
          git submodule status
          echo ""
          echo "📁 Checking krocs-config directory:"
          ls -la backend/src/main/resources/
          if [ -d "backend/src/main/resources/krocs-config" ]; then
            echo "✅ krocs-config submodule found"
            ls -la backend/src/main/resources/krocs-config/
          else
            echo "❌ krocs-config submodule not found!"
            exit 1
          fi

      # 3. Java 환경 설정
      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # 4. Gradle 설정
      - name: 🔧 Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: wrapper

      - name: 🔑 Grant execute permission for gradlew
        run: chmod +x backend/gradlew

      # 5. 테스트 실행 (일부 실패 허용)
      - name: 🧪 Run tests with failure tolerance
        working-directory: ./backend
        run: |
          echo "🧪 Running tests (allowing some failures for deployment)..."
          ./gradlew test --continue || echo "⚠️ Some tests failed, but continuing with deployment"
          echo "📋 Test results will be uploaded for review"
        continue-on-error: true

      # 5-1. 테스트 결과 업로드 (실패해도 결과 확인 가능)
      - name: 📊 Upload test results
        uses: actions/upload-artifact@v4
        if: always()  # 성공/실패 관계없이 업로드
        with:
          name: test-results
          path: backend/build/reports/tests/
          retention-days: 7

      # 6. Docker Hub 로그인
      - name: 🐳 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # 7. Docker 이미지 빌드 및 Docker Hub 푸시
      - name: 🏗️ Build and push Docker image to Docker Hub
        working-directory: ./backend
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "🔨 Building Docker image..."
          echo "📋 Build context contents:"
          ls -la
          echo "📋 Config directory contents:"
          ls -la src/main/resources/krocs-config/ || echo "Config directory not found"
          
          docker build -t $DOCKER_HUB_USERNAME/$DOCKER_HUB_REPOSITORY:$IMAGE_TAG .
          docker build -t $DOCKER_HUB_USERNAME/$DOCKER_HUB_REPOSITORY:latest .
          
          echo "📤 Pushing Docker image to Docker Hub..."
          docker push $DOCKER_HUB_USERNAME/$DOCKER_HUB_REPOSITORY:$IMAGE_TAG
          docker push $DOCKER_HUB_USERNAME/$DOCKER_HUB_REPOSITORY:latest
          
          echo "✅ Image pushed to Docker Hub successfully!"
          echo "📍 Image URI: $DOCKER_HUB_USERNAME/$DOCKER_HUB_REPOSITORY:latest"

      # 8-1. 배포 파일들을 GCP VM으로 복사
      - name: 📁 Copy deployment files to GCP VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_USERNAME }}
          key: ${{ secrets.GCP_VM_PRIVATE_KEY }}
          source: "deploy/*"
          target: "/home/${{ secrets.GCP_VM_USERNAME }}/krocs-backend/"
          strip_components: 1

      # 8. GCP VM 배포 (Docker Compose + Docker Hub + Nginx + HTTPS)
      - name: 🚀 Deploy to GCP VM with Docker Compose and HTTPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_USERNAME }}
          key: ${{ secrets.GCP_VM_PRIVATE_KEY }}
          script: |
            echo "🚀 Starting deployment to GCP VM with HTTPS..."
            
            # 환경변수 파일 생성 (.env)
            cd /home/${{ secrets.GCP_VM_USERNAME }}/krocs-backend/deploy
            
            cat > .env << 'EOF'
            DOCKER_HUB_USERNAME=${{ secrets.DOCKER_HUB_USERNAME }}
            DOCKER_HUB_REPOSITORY=${{ secrets.DOCKER_HUB_REPOSITORY }}
            DB_URL=${{ secrets.DB_URL }}
            DB_USER=${{ secrets.DB_USER }}
            EOF
            
            # DB 비밀번호는 base64 디코딩
            echo "DB_PASSWORD=$(echo '${{ secrets.DB_PASSWORD }}' | base64 -d)" >> .env
            
            cat >> .env << 'EOF'
            frontOrigin=${{ secrets.FRONT_ORIGIN }}
            baseUrl=${{ secrets.BASE_URL }}
            EOF
            
            echo "✅ .env file created"
            
            echo "🔴 Stopping existing services..."
            # 기존 서비스 중지
            docker compose -f docker-compose.prod.yml down || true
            
            # 오래된 이미지 정리
            docker image prune -f || true
            
            # 최신 이미지 풀
            echo "📥 Pulling latest image from Docker Hub..."
            docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/${{ secrets.DOCKER_HUB_REPOSITORY }}:latest
            
            # 서비스 시작
            echo "🚀 Starting services with HTTPS..."
            docker compose -f docker-compose.prod.yml up -d
            
            # 서비스 상태 확인
            echo "📊 Checking service status..."
            sleep 10
            docker ps
            
            echo ""
            echo "🎉 GCP VM HTTPS 배포가 완료되었습니다!"
            echo "🔒 HTTPS URL: https://${{ secrets.DOMAIN_NAME }}"
            echo "📊 Swagger UI: https://${{ secrets.DOMAIN_NAME }}/swagger-ui/index.html"