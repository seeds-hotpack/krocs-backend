version: "3.8"

services:
  # Nginx 리버스 프록시 (HTTP + HTTPS)
  nginx:
    image: nginx:alpine
    container_name: krocs-nginx
    ports:
      - "80:80"    # HTTP (Let's Encrypt 챌린지 + 리다이렉트용)
      - "443:443"  # HTTPS (실제 서비스용)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/www:/var/www/certbot/:ro
      - ./certbot/conf:/etc/nginx/ssl/:ro
    depends_on:
      - krocs-backend
    restart: unless-stopped
    networks:
      - krocs-network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # SSL 인증서 관리 (Let's Encrypt)
  certbot:
    image: certbot/certbot:latest
    container_name: krocs-certbot
    volumes:
      - ./certbot/www:/var/www/certbot/:rw
      - ./certbot/conf:/etc/letsencrypt/:rw
    networks:
      - krocs-network

  # Spring Boot Application (from ECR)
  krocs-backend:
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:latest
    container_name: krocs-backend
    ports:
      - "8080:8080"  # 내부 통신용
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_URL=${DB_URL}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - krocs-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Redis for caching and token storage
  redis:
    image: redis:7-alpine
    container_name: krocs-redis
    ports:
      - "6379:6379"
    volumes:
      - krocs-redis-data:/data
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    networks:
      - krocs-network

volumes:
  krocs-redis-data:
    driver: local

networks:
  krocs-network:
    driver: bridge