version: "3.8"

services:
  # Spring Boot Application (from ECR)
  krocs-backend:
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:latest
    container_name: krocs-backend
    ports:
      - "8080:8080"
      - "80:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_URL=${DB_URL}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - krocs-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Redis for caching and token storage
  redis:
    image: redis:7-alpine
    container_name: krocs-redis
    ports:
      - "6379:6379"
    volumes:
      - krocs-redis-data:/data
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    networks:
      - krocs-network

volumes:
  krocs-redis-data:
    driver: local

networks:
  krocs-network:
    driver: bridge